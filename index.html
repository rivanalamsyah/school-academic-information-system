<!doctype html>
<html lang="id">

    <!-- ── Open Graph / Facebook ─────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smaglobal.sch.id/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="SIAS – SMA Global" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://smaglobal.sch.id/og-image.jpg" />

    <!-- ── PWA & Theme ────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIAS Portal" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Icons ─────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- ── Performance: DNS prefetch & preconnect to external origins ─────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseapp.com" />

    <!-- ── Structured Data: Organization (JSON-LD) ────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "SMA Global",
      "alternateName": "SMA Global",
      "url": "https://smaglobal.sch.id",
      "logo": "https://smaglobal.sch.id/icon.svg",
      "description": "SMA Global adalah sekolah menengah atas negeri unggulan di Yogyakarta yang menyediakan portal akademik digital terpadu (SIAS).",

        "@type": "PostalAddress",
        "streetAddress": "Jl. Pendidikan Raya No. 1",
        "addressLocality": "Condongcatur",
        "addressRegion": "DKI Yogyakarta",
        "postalCode": "12160",
        "addressCountry": "ID"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+62-21-555-0199",
        "contactType": "customer service",
        "availableLanguage": "Indonesian"
      },
      "sameAs": [
        "https://www.facebook.com/smaglobal",
        "https://www.instagram.com/smaglobal"
      ]
    }
    </script>

    <!-- ── Structured Data: WebSite with SearchAction (JSON-LD) ─────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SIAS – Portal Akademik SMA Global",
      "url": "https://smaglobal.sch.id",
      "inLanguage": "id"
    }

  <body>
    <!-- Skip to main content link for keyboard/screen reader users -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:font-bold focus:text-sm"
    >
      Langsung ke konten utama
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Service Worker Registration ───────────────────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker registered:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
